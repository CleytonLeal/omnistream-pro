version: '3.8'

services:
  omnistream:
    build: .
    container_name: omnistream_pro
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - PYTHONUNBUFFERED=1
    volumes:
      - omnistream_downloads:/app/downloads
      - ./config.json:/app/config.json:ro

volumes:
  omnistream_downloads:
    name: omnistream_downloads_data
